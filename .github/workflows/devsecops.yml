name: DevSecOps Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# Requisito 1 — Gitleaks: deteccao de segredos no historico do repositorio
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  gitleaks:
    name: Gitleaks — segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — varrer historico por segredos vazados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ──────────────────────────────────────────────────────────────────────────
  # Testes com cobertura (base para o SonarCloud)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Executar testes com cobertura
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Requisito 2 — SonarCloud: analise estatica (SAST) + Quality Gate
  # ──────────────────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud — SAST
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud — analise de codigo e Quality Gate
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Build da imagem Docker (compartilhada entre trivy-image, syft e publish)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Exportar imagem como artefato
        run: docker save ${{ env.IMAGE }}:${{ github.sha }} | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Requisito 3a — Trivy: analise de dependencias do projeto (filesystem)
  # ──────────────────────────────────────────────────────────────────────────
  trivy-deps:
    name: Trivy — dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Trivy fs: bloquear CRITICAL e HIGH com correcao disponivel"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table

      - name: "Trivy fs: relatorio LOW e MEDIUM (nao bloqueia)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          exit-code: "0"
          severity: LOW,MEDIUM
          format: json
          output: trivy-deps-low-medium.json
        if: always()

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-deps-report
          path: trivy-deps-low-medium.json
        if: always()

  # ──────────────────────────────────────────────────────────────────────────
  # Requisito 3b — Trivy: analise da imagem Docker construida
  # ──────────────────────────────────────────────────────────────────────────
  trivy-image:
    name: Trivy — imagem Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: docker load < image.tar.gz

      - name: "Trivy image: bloquear CRITICAL e HIGH com correcao disponivel"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table

      - name: "Trivy image: relatorio LOW e MEDIUM (nao bloqueia)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          exit-code: "0"
          severity: LOW,MEDIUM
          format: json
          output: trivy-image-low-medium.json
        if: always()

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-low-medium.json
        if: always()

  # ──────────────────────────────────────────────────────────────────────────
  # Requisito 4 — Syft: geracao de SBOM da imagem Docker
  # ──────────────────────────────────────────────────────────────────────────
  syft:
    name: Syft — SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: docker load < image.tar.gz

      - name: Gerar SBOM com Syft (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

  # ──────────────────────────────────────────────────────────────────────────
  # Publicar imagem no GHCR — somente apos aprovacao de TODOS os checks
  # (executa apenas em push para main, nao em PRs)
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Publicar no GHCR
    runs-on: ubuntu-latest
    needs: [gitleaks, sonarcloud, trivy-deps, trivy-image, syft]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push para o GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
